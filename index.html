 direction ! Une grosse tempête est arrivée. Jonas a été jeté à la mer, et un très grand poisson l’a avalé. Dans le ventre du poisson, Jonas a prié Jéhovah. Le poisson l’a recraché sur la plage. Cette fois, Jonas est allé à Ninive, et les gens ont écouté.",questions:["Pourquoi Jonas est-il parti dans l’autre direction ?","Qu’a fait Jonas dans le ventre du poisson ?","Que peux-tu faire quand tu as peur ?"],activite:{nom:"Le bateau dans la tempête",consignes:"Fabriquez un petit bateau en papier, puis racontez l’histoire en le faisant bouger.",materiel:"Une feuille de papier"},lecon:"Même quand on se trompe, on peut prier Jéhovah et recommencer.",priere:"Jéhovah, aide-moi à être courageux pour faire ce que tu demandes."},pt:{titre:"Jonas e o grande peixe",histoire:"Jeová pediu a Jonas que fosse falar com o povo da cidade de Nínive. Mas Jonas ficou com medo e foi de barco para o outro lado! Veio uma grande tempestade. Jonas foi jogado no mar, e um peixe enorme o engoliu. Dentro do peixe, Jonas orou a Jeová. O peixe o colocou na praia. Dessa vez, Jonas foi a Nínive, e o povo escutou.",questions:["Por que Jonas foi para o outro lado?","O que Jonas fez dentro do peixe?","O que você pode fazer quando sente medo?"],activite:{nom:"O barco na tempestade",consignes:"Façam um barquinho de papel e contem a história movendo o barco.",materiel:"Uma folha de papel"},lecon:"Mesmo quando erramos, podemos orar a Jeová e recomeçar.",priere:"Jeová, me ajude a ter coragem para fazer o que você pede."}},{id:"k-david",e:"🪨",ref:R_(9,17,null),fr:{titre:"David et Goliath",histoire:"Goliath était un géant très fort qui se moquait du peuple de Jéhovah. Tous les soldats avaient peur. Mais David, un jeune berger, a dit : « Jéhovah va m’aider. » Il a pris son lance-pierre et cinq pierres lisses. Il a lancé une pierre, et Goliath est tombé ! David n’avait pas confiance en sa force, mais en Jéhovah.",questions:["Pourquoi les soldats avaient-ils peur ?","En qui David avait-il confiance ?","Quel est ton « Goliath », la chose qui te fait peur ?"],activite:{nom:"Les cinq pierres",consignes:"Cherchez cinq petits objets dans la maison. Pour chacun, dites une chose pour laquelle vous remerciez Jéhovah.",materiel:"Cinq petits objets"},lecon:"Avec Jéhovah, on peut être courageux.",priere:"Jéhovah, quand j’ai peur, aide-moi à avoir confiance en toi."},pt:{titre:"Davi e Golias",histoire:"Golias era um gigante muito forte que zombava do povo de Jeová. Todos os soldados tinham medo. Mas Davi, um jovem pastor, disse: “Jeová vai me ajudar.” Ele pegou sua funda e cinco pedras lisas. Lançou uma pedra, e Golias caiu! Davi não confiava na sua força, mas em Jeová.",questions:["Por que os soldados tinham medo?","Em quem Davi confiava?","Qual é o seu “Golias”, aquilo que te dá medo?"],activite:{nom:"As cinco pedras",consignes:"Procurem cinco objetos pequenos em casa. Para cada um, digam algo pelo qual agradecem a Jeová.",materiel:"Cinco objetos pequenos"},lecon:"Com Jeová, podemos ter coragem.",priere:"Jeová, quando eu sentir medo, me ajude a confiar em você."}},{id:"k-daniel",e:"🦁",ref:R_(27,6,null),fr:{titre:"Daniel et les lions",histoire:"Daniel priait Jéhovah trois fois par jour. Des hommes jaloux ont fait une loi : interdit de prier quelqu’un d’autre que le roi ! Daniel a continué à prier Jéhovah. Alors on l’a jeté dans une fosse pleine de lions. Mais Jéhovah a envoyé son ange, qui a fermé la gueule des lions. Le lendemain matin, Daniel était sain et sauf !",questions:["Combien de fois par jour Daniel priait-il ?","Qu’a fait l’ange de Jéhovah ?","Quand aimes-tu prier, toi ?"],activite:{nom:"Les lions endormis",consignes:"Un joueur est Daniel, l’autre est un lion qui dort. Le lion n’a pas le droit de bouger pendant que Daniel raconte une prière de merci.",materiel:"Un coussin pour la fosse"},lecon:"Rien ne doit nous empêcher de prier Jéhovah.",priere:"Merci Jéhovah, tu écoutes toujours mes prières."},pt:{titre:"Daniel e os leões",histoire:"Daniel orava a Jeová três vezes por dia. Uns homens com inveja fizeram uma lei: proibido orar a qualquer um que não fosse o rei! Daniel continuou orando a Jeová. Então o jogaram numa cova cheia de leões. Mas Jeová enviou seu anjo, que fechou a boca dos leões. Na manhã seguinte, Daniel estava bem!",questions:["Quantas vezes por dia Daniel orava?","O que o anjo de Jeová fez?","Quando você gosta de orar?"],activite:{nom:"Os leões dormindo",consignes:"Um é Daniel, o outro é um leão dormindo. O leão não pode se mexer enquanto Daniel faz uma oração de agradecimento.",materiel:"Uma almofada para a cova"},lecon:"Nada deve nos impedir de orar a Jeová.",priere:"Obrigado, Jeová, porque você sempre ouve minhas orações."}},{id:"k-creation",e:"🌍",ref:R_(1,1,null),fr:{titre:"Jéhovah a tout créé",histoire:"Au commencement, Jéhovah a créé le ciel et la terre. Il a fait la lumière, le ciel, la mer et la terre sèche. Il a fait pousser les arbres et les fleurs. Il a mis le soleil, la lune et les étoiles. Puis il a créé les poissons, les oiseaux et tous les animaux. Enfin, il a créé le premier homme et la première femme. Et Jéhovah a vu que tout était très bon !",questions:["Qu’est-ce que Jéhovah a créé ?","Quel animal préfères-tu ?","Comment peux-tu dire merci pour la création ?"],activite:{nom:"Chasse aux merveilles",consignes:"Cherchez dehors ou par la fenêtre trois choses créées par Jéhovah, et dessinez votre préférée.",materiel:"Papier et crayons"},lecon:"Tout ce qui est beau autour de nous vient de Jéhovah.",priere:"Merci Jéhovah pour les fleurs, les animaux et tout ce que tu as fait."},pt:{titre:"Jeová criou tudo",histoire:"No princípio, Jeová criou os céus e a terra. Ele fez a luz, o céu, o mar e a terra seca. Fez crescer as árvores e as flores. Colocou o sol, a lua e as estrelas. Depois criou os peixes, as aves e todos os animais. Por fim, criou o primeiro homem e a primeira mulher. E Jeová viu que tudo era muito bom!",questions:["O que Jeová criou?","Qual animal você prefere?","Como você pode agradecer pela criação?"],activite:{nom:"Caça às maravilhas",consignes:"Procurem lá fora ou pela janela três coisas que Jeová criou e desenhem a preferida.",materiel:"Papel e lápis"},lecon:"Tudo o que é bonito ao nosso redor vem de Jeová.",priere:"Obrigado, Jeová, pelas flores, pelos animais e por tudo o que você fez."}},{id:"k-jesus12",e:"👦",ref:R_(42,2,"41-52"),fr:{titre:"Jésus enfant au temple",histoire:"Quand Jésus avait 12 ans, sa famille est allée à Jérusalem pour une grande fête. Sur le chemin du retour, Marie et Joseph ont remarqué que Jésus n’était pas avec eux ! Ils l’ont cherché pendant trois jours. Ils l’ont trouvé au temple, en train d’écouter les enseignants et de leur poser des questions. Tout le monde était étonné de ce qu’il comprenait. Ensuite, Jésus est rentré avec eux et il leur obéissait.",questions:["Où Marie et Joseph ont-ils trouvé Jésus ?","Que faisait Jésus au temple ?","Qu’aimes-tu apprendre sur Jéhovah ?"],activite:{nom:"Le jeu des questions",consignes:"Chacun pose une question sur la Bible à l’autre. Si vous ne savez pas, cherchez ensemble !",materiel:"La Bible"},lecon:"Jésus aimait apprendre sur son Père et il obéissait à ses parents.",priere:"Jéhovah, aide-moi à aimer apprendre sur toi comme Jésus."},pt:{titre:"Jesus menino no templo",histoire:"Quando Jesus tinha 12 anos, sua família foi a Jerusalém para uma grande festa. Na volta, Maria e José perceberam que Jesus não estava com eles! Procuraram por três dias. Encontraram Jesus no templo, ouvindo os instrutores e fazendo perguntas. Todos ficaram admirados com o que ele entendia. Depois, Jesus voltou com eles e era obediente.",questions:["Onde Maria e José encontraram Jesus?","O que Jesus fazia no templo?","O que você gosta de aprender sobre Jeová?"],activite:{nom:"Jogo das perguntas",consignes:"Cada um faz uma pergunta sobre a Bíblia ao outro. Se não souberem, procurem juntos!",materiel:"A Bíblia"},lecon:"Jesus gostava de aprender sobre seu Pai e obedecia aos pais.",priere:"Jeová, me ajude a gostar de aprender sobre você, como Jesus."}},{id:"k-samaritain",e:"💗",ref:R_(42,10,"30-37"),fr:{titre:"Le bon Samaritain",histoire:"Jésus a raconté une histoire. Un homme marchait sur la route quand des voleurs l’ont attaqué et laissé blessé. Un prêtre est passé, mais il ne s’est pas arrêté. Un autre homme est passé lui aussi, sans l’aider. Puis un Samaritain est arrivé. Il a soigné l’homme, l’a mis sur son âne et a pris soin de lui. Jésus a dit : « Va, et fais de même. »",questions:["Qui a aidé l’homme blessé ?","Pourquoi est-ce important d’aider les autres ?","Qui pourrais-tu aider cette semaine ?"],activite:{nom:"Le petit infirmier",consignes:"Soignez une peluche « blessée » avec des pansements en papier, en disant des mots gentils.",materiel:"Une peluche, du papier, du scotch"},lecon:"Jéhovah aime qu’on soit gentil avec tout le monde.",priere:"Jéhovah, aide-moi à voir qui a besoin d’aide autour de moi."},pt:{titre:"O bom samaritano",histoire:"Jesus contou uma história. Um homem andava pela estrada quando ladrões o atacaram e o deixaram ferido. Passou um sacerdote, mas ele não parou. Outro homem também passou e não ajudou. Então chegou um samaritano. Ele cuidou do homem, colocou-o no seu jumento e tomou conta dele. Jesus disse: “Vá e faça o mesmo.”",questions:["Quem ajudou o homem ferido?","Por que é importante ajudar os outros?","Quem você poderia ajudar esta semana?"],activite:{nom:"O pequeno enfermeiro",consignes:"Cuidem de um bichinho de pelúcia “machucado” com curativos de papel, falando palavras bondosas.",materiel:"Um bichinho de pelúcia, papel, fita adesiva"},lecon:"Jeová gosta que sejamos bondosos com todos.",priere:"Jeová, me ajude a ver quem precisa de ajuda ao meu redor."}},{id:"k-pains",e:"🍞",ref:R_(43,6,"5-13"),fr:{titre:"Le garçon qui a partagé",histoire:"Une très grande foule écoutait Jésus, et les gens avaient faim. Un petit garçon avait cinq pains et deux poissons. Il les a donnés. Jésus a remercié Jéhovah, puis il a fait distribuer la nourriture. Et il y e
