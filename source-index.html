<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lampe — études bibliques en famille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Pacifico&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#fafafa; --card:#ffffff; --ink:#262626; --muted:#8e8e8e; --line:#efefef; --soft:#f2f2f2;
  --grad:linear-gradient(45deg,#feda75 0%,#fa7e1e 25%,#d62976 50%,#962fbf 75%,#4f5bd5 100%);
  --heart:#ff3040; --blue:#0095f6; --green:#22c55e; --r:22px;
}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#121212;--ink:#f5f5f5;--muted:#a8a8a8;--line:#262626;--soft:#1f1f1f}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none;font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:520px;margin:0 auto;padding:0 0 96px}
/* Barre du haut */
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.logo{font-family:"Pacifico",cursive;font-size:29px;line-height:1.1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:4px}
.ticons{display:flex;gap:6px;align-items:center}
.ibtn{position:relative;border:0;background:transparent;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;transition:transform .15s}
.ibtn:active{transform:scale(.88)}
.ibtn svg{width:26px;height:26px}
.badge-n{position:absolute;top:3px;right:2px;background:var(--heart);color:#fff;font-size:11px;font-weight:900;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg)}
main{padding:0 12px}
.enter{animation:enter .32s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.94);opacity:0}100%{transform:none;opacity:1}}
@keyframes heart{0%{transform:scale(1)}25%{transform:scale(1.4)}55%{transform:scale(.9)}100%{transform:scale(1)}}
@keyframes bigheart{0%{transform:scale(0);opacity:0}15%{transform:scale(1.2);opacity:.95}30%{transform:scale(.95)}45%{transform:scale(1)}80%{opacity:.95}100%{transform:scale(1.1);opacity:0}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
@keyframes spinring{to{transform:rotate(360deg)}}
@keyframes fall{0%{transform:translate3d(0,-10vh,0) rotate(0)}100%{transform:translate3d(var(--dx),110vh,0) rotate(720deg)}}
/* Stories */
.stories{display:flex;gap:14px;overflow-x:auto;padding:8px 4px 12px;scrollbar-width:none;margin:0 -12px;padding-left:16px;padding-right:16px}
.stories::-webkit-scrollbar{display:none}
.story{flex:none;width:72px;text-align:center;border:0;background:none;padding:0}
.ring{width:70px;height:70px;border-radius:50%;padding:2.5px;background:var(--grad);margin:0 auto;transition:transform .18s}
.story:active .ring{transform:scale(.92)}
.ring.seen{background:var(--line)}
.ring.busy{animation:spinring 1.2s linear infinite}
.ring>span{display:block;width:100%;height:100%;border-radius:50%;background:var(--card);padding:3px}
.face{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font-size:29px;background:var(--g)}
.story small{display:block;font-size:12px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
/* Posts */
.post{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin:12px 0 18px;overflow:hidden}
.post-h{display:flex;align-items:center;gap:10px;padding:11px 14px}
.av{flex:none;width:36px;height:36px;border-radius:50%;padding:2px;background:var(--grad)}
.av>span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--card);font-size:17px;font-weight:900;border:2px solid var(--card)}
.av.lg{width:78px;height:78px;padding:3px}.av.lg>span{font-size:30px;border-width:3px}
.post-h .who{flex:1;min-width:0;line-height:1.2}
.post-h .who b{font-weight:800;font-size:14px}
.post-h .who small{display:block;color:var(--muted);font-size:12px}
.tile{position:relative;min-height:250px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px 22px;color:#fff;background:var(--g);user-select:none}
.tile .emo{font-size:58px;line-height:1;filter:drop-shadow(0 6px 14px rgba(0,0,0,.18))}
.tile .big{font-weight:900;font-size:26px;line-height:1.15;margin-top:12px;text-shadow:0 2px 14px rgba(0,0,0,.12);letter-spacing:-.3px}
.tile .sub{font-weight:700;opacity:.93;margin-top:8px;font-size:15px}
.tile .bh{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-size:110px;color:#fff;opacity:0;filter:drop-shadow(0 8px 24px rgba(0,0,0,.25))}
.tile .bh.go{animation:bigheart 1s ease both}
.tile.done::after{content:"✓ Fait";position:absolute;top:14px;right:14px;background:rgba(255,255,255,.28);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:5px 12px;border-radius:999px;font-weight:900;font-size:13px}
.acts{display:flex;align-items:center;gap:6px;padding:6px 8px 0}
.acts .ibtn svg{width:27px;height:27px}
.acts .sp{flex:1}
.heart.on svg{fill:var(--heart);stroke:var(--heart)}
.heart.pop{animation:heart .45s ease}
.cap{padding:4px 14px 14px;font-size:14px}
.cap b{font-weight:800}
.cap .muted,.muted{color:var(--muted)}
.small{font-size:13px}.tiny{font-size:12px}
.links a{display:inline-block;margin:6px 12px 0 0}
/* Couleurs */
.g-sun{--g:linear-gradient(135deg,#fdc830,#f37335)} .g-lecture{--g:linear-gradient(135deg,#ff9a56,#ff3f81)}
.g-prep{--g:linear-gradient(135deg,#5b8cff,#a259ff)} .g-tg{--g:linear-gradient(135deg,#21d4fd,#2152ff)}
.g-qcm{--g:linear-gradient(135deg,#0ba360,#3cba92)} .g-culte{--g:linear-gradient(135deg,#ff7eb3,#ff9a76)}
.g-perso{--g:linear-gradient(135deg,#a259ff,#ff5ea8)} .g-night{--g:linear-gradient(135deg,#373b44,#6a3093)}
.g-sky{--g:linear-gradient(135deg,#43cea2,#185a9d)} .g-mint{--g:linear-gradient(135deg,#84fab0,#8fd3f4)}
.g-peach{--g:linear-gradient(135deg,#f6d365,#fda085)} .g-berry{--g:linear-gradient(135deg,#f857a6,#ff5858)}
.g-lav{--g:linear-gradient(135deg,#a18cd1,#fbc2eb)} .g-ocean{--g:linear-gradient(135deg,#2193b0,#6dd5ed)}
.g-insta{--g:linear-gradient(45deg,#fa7e1e,#d62976,#962fbf)}
/* Boutons et pastilles */
.pb{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:11px 20px;font-weight:800;min-height:44px;transition:transform .15s,filter .15s;background:var(--soft);color:var(--ink)}
.pb:active{transform:scale(.95)}
.pb.grad{background:var(--grad);color:#fff;background-size:150% 150%}
.pb.blue{background:var(--blue);color:#fff}
.pb.white{background:#fff;color:#262626}
.pb.glass{background:rgba(255,255,255,.24);color:#fff;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pb.sm{padding:7px 14px;min-height:34px;font-size:13px}
.pb.block{width:100%}
.pb[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 15px;font-weight:700;font-size:14px;transition:transform .15s,background .2s}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:800;background:var(--soft)}
.tag.kid{background:#ffe3ef;color:#d6286f} .tag.gold{background:#fff1d6;color:#c27a00}
@media (prefers-color-scheme:dark){.tag.kid{background:#3d1426;color:#ff8fbd}.tag.gold{background:#3b2a0a;color:#ffc35a}}
.hello{padding:2px 4px 0}
.hello h1{font-size:23px;font-weight:900;margin:0;letter-spacing:-.4px}
.hello p{margin:2px 0 8px;color:var(--muted);font-weight:600}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:18px 4px 8px}
.sec h2{font-size:17px;font-weight:900;margin:0}
/* Mini cartes horizontales */
.minis{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 12px 6px}
.minis::-webkit-scrollbar{display:none}
.mini{flex:none;width:138px;height:168px;border-radius:20px;border:0;background:var(--g);color:#fff;padding:14px 12px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;position:relative;transition:transform .15s}
.mini:active{transform:scale(.95)}
.mini .e{font-size:30px}
.mini b{font-weight:900;font-size:14px;line-height:1.2}
.mini small{font-weight:700;opacity:.9;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.mini.done{opacity:.55}
.mini.done::after{content:"✓";position:absolute;top:10px;right:12px;font-weight:900;background:rgba(255,255,255,.3);width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
/* Grille Explorer */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;border-radius:20px;overflow:hidden}
.gt{aspect-ratio:1;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;font-weight:800;font-size:12.5px;line-height:1.15;text-align:center;padding:8px;background:var(--g);transition:transform .15s,filter .15s}
.gt:active{transform:scale(.94);filter:brightness(1.1)}
.gt .e{font-size:30px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.15))}
.gt.big{grid-column:span 2;grid-row:span 2;font-size:17px}.gt.big .e{font-size:54px}
/* Carrousel (études, culte) */
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-behavior:smooth}
.car::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;min-height:430px;padding:30px 24px;color:#fff;background:var(--g);display:flex;flex-direction:column;justify-content:center}
.slide .k{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;opacity:.85}
.slide h3{font-size:24px;font-weight:900;line-height:1.15;margin:8px 0 12px;letter-spacing:-.3px}
.slide .q{font-size:27px;font-weight:900;line-height:1.2;letter-spacing:-.4px}
.slide p{font-size:17px;line-height:1.5;margin:0 0 10px;font-weight:600}
.slide .hint{margin-top:18px;font-weight:800;opacity:.85;font-size:14px}
.slide textarea{background:rgba(255,255,255,.2);border:0;color:#fff;font-weight:700}
.slide textarea::placeholder{color:rgba(255,255,255,.75)}
.refc{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.24);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff!important;padding:6px 13px;border-radius:999px;font-weight:800;font-size:14px;margin:6px 6px 0 0}
.dots{display:flex;justify-content:center;gap:5px;padding:10px 0 2px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line);transition:all .2s}
.dots i.on{background:var(--blue);width:16px;border-radius:4px}
/* Quiz */
.quiz{border-radius:26px;background:var(--g);color:#fff;padding:16px 18px 22px;min-height:560px;margin:10px 0;display:flex;flex-direction:column}
.segs{display:flex;gap:4px}
.segs i{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.35)}
.segs i.on{background:#fff}
.qq{font-size:25px;font-weight:900;line-height:1.2;margin:26px 0 16px;letter-spacing:-.3px}
.qo{display:block;width:100%;text-align:left;background:rgba(255,255,255,.96);color:#262626;border:0;border-radius:18px;padding:15px 16px;margin:9px 0;font-weight:800;font-size:16px;transition:transform .15s,background .2s}
.qo:active{transform:scale(.97)}
.qo.good{background:var(--green);color:#fff;animation:pulse .4s}
@keyframes pulse{50%{transform:scale(1.035)}}
.qo.bad{background:var(--heart);color:#fff;animation:shake .4s}
.qo.dim{opacity:.55}
.fb{background:rgba(255,255,255,.2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:18px;padding:13px 15px;margin-top:8px;font-weight:700;animation:pop .3s}
.score{font-size:72px;font-weight:900;line-height:1;margin:16px 0 6px}
/* Formulaires */
input[type=text],input[type=number],input[type=time],textarea,select{font:inherit;font-weight:600;color:inherit;background:var(--soft);border:1.5px solid transparent;border-radius:16px;padding:12px 14px;width:100%;transition:border .2s,background .2s}
input:focus,textarea:focus,select:focus{outline:none;border-color:#d62976;background:var(--card)}
textarea{min-height:90px;resize:vertical}
label.f{display:block;margin:12px 2px 6px;font-size:13px;font-weight:800;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.box h3{margin:0 0 6px;font-size:18px;font-weight:900}
.note{background:var(--soft);border-radius:16px;padding:11px 13px;font-size:14px;font-weight:600}
.warn{background:#ffe5e7;color:#c41c2c;border-radius:16px;padding:11px 13px;font-size:14px;font-weight:700;margin-top:10px}
/* Barre du bas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 10px calc(8px + env(safe-area-inset-bottom))}
nav.tabs button{border:0;background:transparent;width:56px;height:46px;display:grid;place-items:center;border-radius:14px;position:relative;transition:transform .15s}
nav.tabs button:active{transform:scale(.86)}
nav.tabs svg{width:27px;height:27px}
nav.tabs button.on svg{stroke-width:2.6}
nav.tabs button.on::after{content:"";position:absolute;bottom:2px;width:5px;height:5px;border-radius:50%;background:var(--grad)}
nav.tabs .plus{width:46px;height:38px;border-radius:13px;background:var(--grad);color:#fff}
nav.tabs .plus svg{stroke:#fff}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* Story plein écran */
#story{position:fixed;inset:0;z-index:50;background:#000;display:flex;justify-content:center}
#story[hidden]{display:none}
.sv{position:relative;width:100%;max-width:480px;height:100%;background:var(--g);color:#fff;display:flex;flex-direction:column;padding:12px 18px calc(22px + env(safe-area-inset-bottom));animation:pop .25s ease}
.sv .segs{margin-top:env(safe-area-inset-top)}
.sv-h{display:flex;align-items:center;gap:10px;margin-top:12px;z-index:3}
.sv-h .av>span{background:rgba(255,255,255,.25);border-color:transparent;color:#fff}
.sv-h b{flex:1}
.sv-x{border:0;background:transparent;color:#fff;font-size:30px;line-height:1;width:44px;height:44px}
.sv-c{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:10px 6px;z-index:1;pointer-events:none}
.sv-c .emo{font-size:76px;line-height:1;filter:drop-shadow(0 8px 20px rgba(0,0,0,.2))}
.sv-c .kk{font-weight:900;text-transform:uppercase;letter-spacing:.1em;font-size:12px;opacity:.85;margin-top:18px}
.sv-c h2{font-size:30px;font-weight:900;line-height:1.12;margin:8px 0;letter-spacing:-.5px}
.sv-c p{font-size:17px;font-weight:700;opacity:.95;margin:4px 0}
.sv-a{display:flex;flex-direction:column;gap:10px;z-index:3}
.tapL,.tapR{position:absolute;top:70px;bottom:120px;z-index:2;border:0;background:transparent}
.tapL{left:0;width:35%}.tapR{right:0;width:65%}
/* Feuille modale */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:40;animation:pop .2s}
#modal[hidden]{display:none}
#modal .sheet{background:var(--card);width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:26px 26px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));animation:enter .3s cubic-bezier(.2,.8,.2,1)}
#modal .sheet::before{content:"";display:block;width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
#modal h3{font-size:20px;font-weight:900;margin:4px 0 6px}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--card);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:800;opacity:0;transition:all .25s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.skel{border-radius:var(--r);height:380px;margin:12px 0;background:linear-gradient(90deg,var(--soft) 0,var(--line) 40%,var(--soft) 80%);background-size:800px 100%;animation:shimmer 1.3s linear infinite;display:grid;place-items:center;font-weight:900;color:var(--muted);text-align:center;padding:20px}
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spinring .8s linear infinite;vertical-align:-3px}
.conf{position:fixed;top:0;width:9px;height:14px;border-radius:3px;z-index:70;pointer-events:none;animation:fall var(--t) cubic-bezier(.25,.6,.4,1) forwards}
.dm{display:flex;gap:12px;align-items:center;padding:10px 4px;border:0;background:transparent;width:100%;text-align:left;border-radius:16px}
.dm:active{background:var(--soft)}
.dm .txt{flex:1;min-width:0}
.dm .txt b{font-weight:800}
.dm .txt div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:14px}
.dm.unread .txt div{color:var(--ink);font-weight:800}
.bluedot{width:9px;height:9px;border-radius:50%;background:var(--blue);flex:none}
.members{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none;padding:6px 2px 10px}
.members::-webkit-scrollbar{display:none}
.mem{flex:none;text-align:center;border:0;background:none;padding:0;width:84px}
.mem small{display:block;font-weight:800;margin-top:6px;font-size:13px}
.mem .tiny{font-weight:600;color:var(--muted)}
.setlist .it{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.setlist .it:first-child{border-top:0}
details summary{cursor:pointer;font-weight:800;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:" ▾";color:var(--muted)}
.tile .chip{background:rgba(255,255,255,.22);border-color:transparent;color:#fff}.tile .chip.on{background:#fff;color:#262626}.tile .chip[disabled]{opacity:.6}
.glassin{background:rgba(255,255,255,.25)!important;color:#fff!important}.glassin::placeholder{color:rgba(255,255,255,.85)}
.navav{width:29px;height:29px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px}
nav.tabs button.on .navav{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink)}
.bk.on svg{fill:currentColor}
.wordmask{border:0;background:rgba(255,255,255,.35);color:#fff;border-radius:7px;padding:0 6px;font:inherit;font-weight:900;letter-spacing:1px;cursor:pointer}
.center{text-align:center}
.mt{margin-top:12px}

/* ---- plan de lecture / mouton ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.bt-bg{--g:var(--bt,linear-gradient(135deg,#84fab0,#8fd3f4))}
.bt-hero{background:var(--bt);color:#fff;border-radius:var(--r);padding:16px 16px 18px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.bt-top{display:flex;justify-content:space-between;font-size:15px}
.bt-sheep{cursor:pointer;display:grid;place-items:center;margin:4px 0}
.sheep{animation:bob 2.6s ease-in-out infinite}

const LocalDB = (() => {
  const K = 'lampe-db-v1'; let data = {}; const subs = {};

  const persist = () => { try { localStorage.setItem(K, JSON.stringify(data)); } catch(e) {} };
  const merge = (a, b) => { const o = Object.assign({}, a); for (const k in b){ o[k] = (b[k] && typeof b[k]==='object' && !Array.isArray(b[k]) && a && typeof a[k]==='object' && !Array.isArray(a[k])) ? merge(a[k], b[k]) : b[k]; } return o; };
  const snap = p => ({ id:p.split('/').pop(), exists:data[p]!==undefined, data:()=>data[p]===undefined?undefined:clone(data[p]), metadata:{fromCache:false,hasPendingWrites:false} });
  const fire = p => { (subs[p]||[]).forEach(f=>f()); const c = p.split('/').slice(0,-1).join('/'); (subs['c:'+c]||[]).forEach(f=>f()); };
  const qs = c => { const n = c.split('/').length + 1; const docs = Object.keys(data).filter(k => k.startsWith(c+'/') && k.split('/').length===n).map(snap); return {docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false,hasPendingWrites:false},docChanges:()=>[]}; };

    update: async o => { if (data[p]===undefined) throw {code:'invalid_argument'}; data[p] = merge(data[p], o); persist(); fire(p); },
    delete: async () => { delete data[p]; persist(); fire(p); },
    onSnapshot: next => sub(p, () => next(snap(p))) });

})();

/* Hors ligne : chaque modification est gardée sur l'appareil tant que la base ne l'a pas reçue.
   Au retour du réseau (même après avoir fermé Lampe), elle est fusionnée avec ce que les autres appareils ont changé. */
const PENDK = 'lampe_pend_v1'; const SRV = {};
let PEND = (() => { try { return JSON.parse(localStorage.getItem(PENDK) || '{}'); } catch(e){ return {}; } })();
const savePend = () => { try { localStorage.setItem(PENDK, JSON.stringify(PEND)); } catch(e) {} };
const pendOn = () => !LOCAL && !GUEST && !!UID;
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
/* fusion à trois : base = dernière version reçue, loc = ce qui a été fait ici, srv = ce qui est en ligne maintenant */
const cl = v => v === undefined ? undefined : clone(v);
function merge3(base, loc, srv){
  if (same(loc, base)) return cl(srv);
  if (same(srv, base) || srv === undefined && base === undefined) return cl(loc);
  if (isObj(loc) && isObj(srv)){
    const b = isObj(base) ? base : {}; const out = {};
    for (const k of new Set([...Object.keys(loc), ...Object.keys(srv), ...Object.keys(b)])){
      const v = merge3(b[k], loc[k], srv[k]); if (v !== undefined) out[k] = v;
    }
    return out;
  }
  return cl(loc);   /* même valeur changée des deux côtés : la modification faite ici l'emporte */
}
/* appelé à chaque donnée reçue de la base : renvoie ce qu'il faut afficher */
function fromSrv(path, d){
  if (!pendOn() || !PEND[path] || PEND[path].uid !== UID){ SRV[path] = d === null ? undefined : clone(d); return d; }
  const p = PEND[path]; const srv = d === null ? undefined : d;
  const m = merge3(p.base, p.local, srv);
  SRV[path] = srv === undefined ? undefined : clone(srv);
  if (same(m, srv)) { delete PEND[path]; savePend(); return d; }
  PEND[path] = { uid:UID, base:SRV[path], local:clone(m), ts:Date.now() }; savePend();
  setTimeout(() => write(path, m), 0);
  return clone(m);
}
function write(path, obj){
  const st = wq[path] || (wq[path] = { busy:false, next:null });
  st.next = clone(obj);
  if (pendOn()){ const old = PEND[path]; PEND[path] = { uid:UID, base: old ? old.base : SRV[path], local:clone(obj), ts:Date.now() }; savePend(); }
  if (!st.busy) pump(path);
}
async function pump(path){
  const st = wq[path]; st.busy = true;
  while (!DB) await new Promise(r => setTimeout(r, 120));
  while (st.next){
    const o = st.next; st.next = null;
    let ok = false;
    try { await DB.doc(path).set(o); ok = true; }
    catch(e){
      if (e && e.code === 'unavailable'){ await new Promise(r => setTimeout(r, 800 + Math.random()*700)); try { await DB.doc(path).set(o); ok = true; } catch(e2){ e = e2; } }
      if (!ok){
      console.warn('écriture', path, e); if (navigator.onLine !== false) { const code = String((e && (e.code || e.name || e.status)) || (e && e.message ? String(e.message).slice(0, 60) : 'inconnu'));
        toast(tx('Sauvegarde impossible pour le moment','Não foi possível salvar agora') + ` (code : ${code} · ${path.split('/').pop()})` + tx(' : nouvel essai dans quelques secondes',': nova tentativa em instantes'));
        try { localStorage.setItem('lampe_lasterr', JSON.stringify({ at:new Date().toISOString(), path, code, msg:String((e && e.message) || '').slice(0, 300) })); } catch(_) {} }
      st.fails = (st.fails || 0) + 1;
      if (!st.next){ st.next = o; await new Promise(r => { st.wake = r; setTimeout(r, Math.min(60000, 2000 * st.fails)); }); st.wake = null; }   /* on garde la modification et on réessaie tant que Lampe est ouverte */
      continue;
      }
    }
    st.fails = 0; SRV[path] = clone(o);
    if (!st.next && PEND[path] && same(PEND[path].local, o)){ delete PEND[path]; savePend(); if (st.wasOff){ st.wasOff = false; toast(tx('Réseau revenu : tes changements sont enregistrés ✓','Rede de volta: tuas alterações foram salvas ✓')); } }
  }
  st.busy = false;
}
/* au retour du réseau : on renvoie tout de suite ce qui attend */
addEventListener('offline', () => { Object.values(wq).forEach(st => st.wasOff = true); toast(tx('Hors ligne : continue, tes changements seront envoyés au retour du réseau','Sem rede: continua, tuas alterações serão enviadas quando a rede voltar')); });

function listen(key, path, apply){

/* Garde selon le numéro de semaine du calendrier : la période qui commence le jour du changement
   compte pour la semaine du lundi qui suit (dimanche 18 h → semaine du lundi). Les vrais numéros sont suivis :
   une année à 53 semaines donne deux semaines impaires de suite (53 puis 1). */
const gardeMon = (k, d) => { const ps = periodStart(k, d); return addDays(ps, (8 - dow(ps)) % 7); };
const gardeSem = (k, d) => isoWeek(gardeMon(k, d)).w;
function baseHere(k, d){
  if (!k.garde || !k.garde.actif) return true;
  if (k.garde.parite === 'paire' || k.garde.parite === 'impaire') return (gardeSem(k, d) % 2 === 0) === (k.garde.parite === 'paire');
  if (!k.garde.ref) return true;
  const n = Math.floor(diffDays(k.garde.ref, d) / 7);
  return ((n % 2) + 2) % 2 === 0;
}
function childHere(k, d){
  if (!k.garde || !k.garde.actif) return true;
  const ex = (k.garde.exceptions || {}); if (d in ex) return ex[d];
  return baseHere(k, d);
}
function periodStart(k, d){ const j = +k.garde.jour; return addDays(d, -((dow(d) - j + 7) % 7)); }
function setGardeJour(k, j){
  j = +j; const old = +k.garde.jour; if (j === old) return;
  if (k.garde.ref){ let delta = (j - old + 7) % 7; if (delta > 3) delta -= 7; k.garde.ref = addDays(k.garde.ref, delta); }
  k.garde.jour = j;
}
function calibrateGarde(k, ceSoirIci){
  const t = todayISO(); const j = +k.garde.jour;
  const last = addDays(t, -((dow(t) - j + 7) % 7));
  k.garde.ref = ceSoirIci ? last : addDays(last, 7);
  /* réglage par numéro de semaine : on choisit la parité qui donne la bonne réponse pour ce soir */
  if (k.garde.parite === 'paire' || k.garde.parite === 'impaire'){ const pair = gardeSem(k, t) % 2 === 0; k.garde.parite = pair === !!ceSoirIci ? 'paire' : 'impaire'; }
}

/* ---------- Programme de la semaine & plan « au bon moment » ---------- */

function capNames(t){ return String(t || '').replace(/\b(jéhovah|jésus|dieu|christ|abraham|moïse|israël|israélites|josaphat|écritures|daniel|ézéchiel|jérémie|david|paul|pierre)\b/gi, w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()); }
/* Découpe des paragraphes de La Tour de Garde en n morceaux, en coupant si possible aux intertitres */
function tgChunks(np, heads, n){
  n = Math.max(1, Math.min(n, np)); const starts = (heads || []).map(h => h[1]).filter(x => x > 1 && x <= np); const cuts = [];
  for (let k = 1; k < n; k++){ const ideal = Math.round(np * k / n) + 1; const near = starts.filter(x => Math.abs(x - ideal) <= 3 && (!cuts.length || x > cuts[cuts.length - 1] + 1)).sort((a, b) => Math.abs(a - ideal) - Math.abs(b - ideal))[0];
    const c = near || ideal; if (c > (cuts[cuts.length - 1] || 1) && c <= np) cuts.push(c); }
  const out = []; let a = 1; for (const c of cuts.concat(np + 1)){ if (c > a){ out.push([a, c - 1, (heads || []).filter(h => h[1] >= a && h[1] <= c - 1).map(h => capNames(h[0]))]); a = c; } }
  return out;
}

const doneMap = mon => (PROG.done[mon] = PROG.done[mon] || {});
function pruneProg(){

  for (const k of Object.keys(PROG.done)) if (k < lim) delete PROG.done[k];
  for (const k of Object.keys(PROG.qcm)) if (k < lim) delete PROG.qcm[k];

  const m = t.match(/\{[\s\S]*\}/); if (!m) throw { code:'parse' }; return JSON.parse(m[0]);
}

function bankQCM(mon){
  const { p } = weekProg(mon); const rnd = seeded(hash('bank' + mon + UID));
  const deja = new Set(Object.values(PROG.qcm || {}).flatMap(q => (q.questions || []).map(x => x.id)).filter(Boolean));
  const due = PROG.rev.filter(r => r.due <= mon).slice(0, 3);
  const score = r => !p ? 0 : (r[3] === p.b && p.c.includes(r[4])) ? 3 : r[3] === p.b ? 2 : Math.abs(r[3] - p.b) <= 3 ? 1 : 0;
  const pool = QB.filter(r => !deja.has(r[0])).map(r => [r, score(r) + rnd()]).sort((a, b) => b[1] - a[1]).map(x => x[0]);
  const qs = pool.slice(0, 10 - due.length).map(r => Object.assign(qView(r, rnd), { explication:'' }));
  const out = due.map(r => Object.assign(clone(r.item), { review:true, revId:r.id })).concat(qs);
  return { lang:LANG, banque:true, sujet: p ? `${bookName(p.b)} (autour des chapitres ${p.c.join(', ')})` : tx('Questions bibliques','Perguntas bíblicas'), questions:out, rep:[], score:null, signal:[] };
}
async function genQCM(mon){
  const { p } = weekProg(mon); const prev = PROG.qcm;
  const scores = Object.keys(prev).sort().slice(-3).map(k => prev[k].score).filter(x => x != null);
  const moy = scores.length ? scores.reduce((a,b)=>a+b,0)/scores.length : 6;
  const niveau = moy >= 8.5 ? 'approfondi (détails, liens entre passages, leçons)' : moy <= 5 ? 'accessible (faits principaux, personnages, idées clés)' : 'intermédiaire';
  const due = PROG.rev.filter(r => r.due <= mon).slice(0,3);
  const nNew = 10 - due.length;
  const styles = ['qui a dit ou fait quoi','où et quand','dans quel ordre','quelle leçon en tirer','compléter l’idée (reformulée)','vrai sens d’une image ou d’un symbole','pourquoi Jéhovah a agi ainsi'];
  const rnd = seeded(hash(mon + UID)); const pick = styles.slice().sort(() => rnd()-.5).slice(0,4).join(', ');
  const deja = Object.values(prev).flatMap(q => (q.questions||[]).map(x => x.q)).slice(-40).join(' | ');
  const sujet = p ? `${bookName(p.b,'fr')} chapitres ${p.c.join(', ')} (livre n° ${p.b})` : `un passage biblique bien connu lié à : ${PROF.envies.join(', ') || 'la vie de Jésus'}`;
  const prompt = `${rules()}

Crée un QCM de ${nNew} questions sur la lecture biblique de la semaine : ${sujet}.
Niveau : ${niveau}. Varie les types de questions, en privilégiant cette semaine : ${pick}.
Chaque question porte sur ce que dit RÉELLEMENT le texte biblique de ces chapitres ; la référence doit être dans ces chapitres.
4 choix par question, une seule bonne réponse sans ambiguïté, des mauvaises réponses plausibles mais clairement fausses d'après le texte.
Questions déjà posées les semaines passées (ne pas répéter) : ${deja || 'aucune'}.
Format JSON exact : {"questions":[{"q":"…","choix":["…","…","…","…"],"bonne":0,"explication":"1 à 2 phrases","ref":{"livre":${p ? p.b : 43},"chapitre":${p ? p.c[0] : 3},"versets":"16"}}]}`;
  const r = await askJSON(prompt, { modelTier:'default' });
  let qs = (Array.isArray(r.questions) ? r.questions : []).filter(q => q && q.q && Array.isArray(q.choix) && q.choix.length === 4 && Number.isInteger(+q.bonne) && +q.bonne >= 0 && +q.bonne < 4 && refOk(q.ref));
  if (p) qs = qs.filter(q => +q.ref.livre === p.b && p.c.includes(+q.ref.chapitre));
  if (qs.length){
    const verif = `Tu es relecteur biblique exigeant. Voici des questions de QCM sur ${sujet}. Pour CHAQUE question, vérifie d'après le texte biblique (Traduction du monde nouveau) que : la bonne réponse indiquée est exacte ; les autres choix sont faux ; la référence pointe bien vers le passage concerné. Si la référence est fausse mais la question juste, donne la bonne référence. En cas de doute, ok=false.
Questions : ${JSON.stringify(qs.map((q,i) => ({ i, q:q.q, choix:q.choix, bonne:q.bonne, ref:q.ref })))}
Réponds UNIQUEMENT : {"verdicts":[{"i":0,"ok":true,"ref":{"livre":24,"chapitre":49,"versets":"11"}}]}`;
    try {
      const v = await askJSON(verif, { modelTier:'complex' });
      const verdicts = Array.isArray(v && v.verdicts) ? v.verdicts : [];
      if (verdicts.length){
        const ok = new Map(verdicts.map(x => [+x.i, x]));
        const kept = [];
        qs.forEach((q, i) => {
          const x = ok.get(i);
          if (!x || x.ok !== true) return;
          if (refOk(x.ref) && (!p || (+x.ref.livre === p.b && p.c.includes(+x.ref.chapitre)))) q.ref = { livre:+x.ref.livre, chapitre:+x.ref.chapitre, versets:x.ref.versets || null };
          kept.push(q);
        });
        qs = kept;
      }
    } catch(e){ /* relecture indisponible : on garde, chaque question reste vérifiable par son lien */ }
  }
  const rnd2 = seeded(hash('mix' + mon + UID));
  const mk = (q, review) => { const order = [0,1,2,3].sort(() => rnd2()-.5); return { q:String(q.q).slice(0,300), choix:order.map(i => String(q.choix[i]).slice(0,200)), bonne:order.indexOf(+q.bonne), explication:String(q.explication||'').slice(0,400), ref:{ livre:+q.ref.livre, chapitre:+q.ref.chapitre, versets:q.ref.versets ? String(q.ref.versets) : null }, review:!!review }; };
  const out = due.map(r => Object.assign(clone(r.item), { review:true, revId:r.id })).concat(qs.slice(0, nNew).map(q => mk(q, false)));
  if (out.length < 3) throw { code:'parse' };
  return { lang:LANG, sujet: p ? `${bookName(p.b)} ${p.c.join(', ')}` : tx('Thème libre','Tema livre'), questions:out, rep:[], score:null, signal:[] };
}

/* Version installée sur l'écran d'accueil : elle se met à jour toute seule, sans rien demander.
   On vérifie quand l'appli revient au premier plan ou passe en arrière-plan, et toutes les 30 minutes. */
(function autoUpdate(){
  const BUILD = window.LAMPE_BUILD; if (!BUILD || !('fetch' in window)) return; let checking = false;
  const calme = () => $('#modal').hidden !== false && !(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) && !Object.values(typeof BUSY === 'object' ? BUSY : {}).some(Boolean);
  const check = force => { if (checking || navigator.onLine === false) return; checking = true;
    fetch('version.txt?t=' + Date.now(), { cache:'no-store' }).then(r => r.ok ? r.text() : '').then(v => { v = (v || '').trim();
      if (v && v !== BUILD && (force || calme())) location.reload(); }).catch(() => {}).finally(() => { checking = false; }); };
  document.addEventListener('visibilitychange', () => check(document.visibilityState === 'hidden'));
  setInterval(() => check(false), 30 * 60e3); setTimeout(() => check(false), 8000);
})();

function normStudy(r, duree, sujet){

  const keep = raw.map((e, i) => ({ i, e })).filter(x => x.e && x.e.texte).slice(0, 6);

    etapes: keep.map(({ e }) => ({ titre:String(e.titre || '').slice(0, 120), texte:String(e.texte).slice(0, 1400), refs:cleanRefs(e.refs), question:e.question ? String(e.question).slice(0, 300) : null })),
    application:String(r.application || '').slice(0, 400), plus:cleanKw(r.pour_aller_plus_loin), revele:0, retenu:'', faite:false };
  s._idx = keep.map(x => x.i); return s;
}

async function makeCoupleStudy(theme){
  const cid = curCouple(); if (!cid) return; closeModal(); VIEW = 'couple'; SUBVIEW = null; window.scrollTo(0, 0); busy('cstudy', true);
  try { const s = await genCoupleStudy(theme); const doc = { id:s.id, ts:Date.now(), by:me().id, data:s, faite:{} }; await DB.doc(`couples/${cid}/etudes/${s.id}`).set(doc); CETUDES.unshift(doc); SUBVIEW = 'cet:' + s.id; CAR_IDX['cet' + s.id] = 0; }
  catch(e){ console.warn(e); toast(aiError(e)); }
  busy('cstudy', false); window.scrollTo(0, 0);
}
async function sendSugg(obj){
  const cid = curCouple(); const p = partner(); if (!cid || !p) return;
  const x = Object.assign({ id:uidGen(), de:me().id, a:p.id, ts:Date.now(), statut:'nouveau', coeur:false }, obj);
  try { await DB.doc(`couples/${cid}/sugg/${x.id}`).set(x); closeModal(); toast('💞 ' + tx('Suggestion envoyée','Sugestão enviada')); }
  catch(e){ console.warn(e); toast(tx('Envoi impossible pour le moment','Não foi possível enviar')); }
}

document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-a]'); if (!el) return; const a = el.dataset.a; if (!a.startsWith('x') && a !== 'sopen2') return;
  const d = el.dataset; if (el.getAttribute('href') === '#' || !el.getAttribute('href')) ev.preventDefault();
  const m = me(); defaultsPerso();
  switch (a){
    case 'xptab': PROFTAB = d.v; render(); break;
    case 'sopen2': VIEW = 'etude'; SUBVIEW = d.id; window.scrollTo(0, 0); render(); break;
    case 'xaddlink': linkModal(); break;
    case 'xlinksave': { const u = $('#lu').value.trim(); if (!okJw(u)){ toast(tx('Seuls les liens jw.org ou wol.jw.org sont acceptés','Apenas links do jw.org')); break; }
      const t = $('#lt').value.trim() || u.replace(/^https:\/\/(www\.)?/, '').slice(0, 60); const note = $('#ln').value.trim(); closeModal(); toggleSave({ key:'lien:' + u, type:'lien', titre:t, url:u, note }); break; }
    case 'xopen': { const x = PERSO.saved.find(s => s.id === d.id); if (!x) break;
      if (x.type === 'etude' && x.sid && ETUDES.list.find(e => e.id === x.sid)){ VIEW = 'etude'; SUBVIEW = x.sid; window.scrollTo(0, 0); render(); }
      else savedModal(x); break; }
    case 'xunsave': PERSO.saved = PERSO.saved.filter(s => s.id !== d.id); savePerso(); closeModal(); render(); break;
    case 'xsave': { // depuis un post / une étude
      const k = d.key; const ty = d.type;
      if (ty === 'lien') toggleSave({ key:k, type:'lien', titre:d.titre, url:d.url });
      if (ty === 'etude'){ const s = ETUDES.list.find(e => e.id === d.id); if (s) toggleSave({ key:k, type:'etude', titre:s.titre, sid:s.id }); else { const e = ENVOIS.find(x => 'env' + x.id === d.id); const ce = CETUDES.find(x => 'cet' + x.id === d.id); const data = (e && e.data) || (ce && ce.data); if (data) toggleSave({ key:k, type:'etude', titre:data.titre, data:clone(data) }); } }
      break; }
    case 'xsavecet': { const ce = CETUDES.find(x => x.id === d.id); if (ce) toggleSave({ key:'etude:' + ce.id, type:'etude', titre:ce.data.titre, data:clone(ce.data) }); break; }
    case 'xnote': noteModal(d.tag, d.titre); break;
    case 'xntag': document.querySelectorAll('[data-a="xntag"]').forEach(b => b.classList.toggle('on', b === el)); $('#ntag').value = d.v; break;
    case 'xnsave': { const txt = $('#nt').value.trim(); if (!txt){ toast(tx('Écris quelque chose','Escreva algo')); break; } PERSO.notes.unshift({ id:uidGen(), ts:Date.now(), tag:$('#ntag').value, titre:$('#ntitre').value, txt:txt.slice(0, 3000) }); PERSO.notes = PERSO.notes.slice(0, 150); savePerso(); closeModal(); toast('📝 ' + tx('Note enregistrée','Nota salva')); render(); break; }
    case 'xndel': PERSO.notes = PERSO.notes.filter(n => n.id !== d.id); savePerso(); render(); break;
    case 'xaddverse': addVerseModal(d.livre ? { livre:+d.livre, chapitre:+d.chapitre, versets:d.versets || '' } : null); break;
    case 'xvlink': { const r = { livre:+$('#vb').value, chapitre:+$('#vc').value || 1, versets:($('#vv') || {}).value }; if (refOk(r)){ const a = document.createElement('a'); a.href = U.bible(r.livre, r.chapitre, LANG, r.versets); a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); } break; }
    case 'xvsave': { const r = { livre:+$('#vb').value, chapitre:+$('#vc').value, versets:$('#vv').value.trim() || null }; const t = $('#vt').value.trim();
      if (!refOk(r)){ toast(tx('Référence invalide','Referência inválida')); break; } if (t.split(/\s+/).length < 3){ toast(tx('Ajoute le texte du verset pour t’entraîner','Adicione o texto do versículo')); break; }
      PERSO.versets.unshift({ id:uidGen(), ts:Date.now(), ref:r, texte:t.slice(0, 1200), niveau:0, next:todayISO() }); PERSO.versets = PERSO.versets.slice(0, 60); savePerso(); closeModal(); PROFTAB = 'versets'; toast('🧠 ' + tx('Verset ajouté','Versículo adicionado')); render(); break; }
    case 'xverse': { const v = PERSO.versets.find(x => x.id === d.id); if (v) verseModal(v); break; }
    case 'xreveal': el.outerHTML = `<span style="background:rgba(255,255,255,.3);border-radius:6px;padding:0 4px">${esc(d.w)}</span>`; break;
    case 'xvspeak': { const v = PERSO.versets.find(x => x.id === d.id); if (v) speak(refLabel(v.ref) + '. ' + v.texte); break; }
    case 'xvgrade': { const v = PERSO.versets.find(x => x.id === d.id); if (!v) break;
      if (d.v === '1'){ v.niveau = Math.min(4, (v.niveau || 0) + 1); v.next = addDays(todayISO(), VSTEPS[v.niveau]); confetti(); toast('🎉 ' + tx('Bravo ! Prochain rappel dans ','Muito bem! Próxima revisão em ') + VSTEPS[v.niveau] + tx(' j',' d')); }
      else { v.niveau = Math.max(0, (v.niveau || 0) - 1); v.next = addDays(todayISO(), 1); toast(tx('On le revoit demain 💪','Revemos amanhã 💪')); }
      savePerso(); closeModal(); render(); break; }
    case 'xvdel': PERSO.versets = PERSO.versets.filter(x => x.id !== d.id); savePerso(); closeModal(); render(); break;
    /* couple */
    case 'xlink': { const p = member(d.id); if (!p) break; m.conjoint = p.id; if (!p.uid || p.conjoint === m.id) p.conjoint = m.id; saveFam(); listenCouple(); toast('💞 ' + tx('Lien créé','Ligação criada')); render(); break; }
    case 'xaccept': { const p = member(d.id); if (!p) break; m.conjoint = p.id; saveFam(); listenCouple(); confetti(); render(); break; }
    case 'xaddspouse': memberModal(null); setTimeout(() => { const xp = $('#xp'); if (xp){ $('#xl').value = 'pt'; const c = $('#xcj'); if (c) c.checked = true; xp.focus(); } }, 30); break;
    case 'xsugg': suggModal(); break;
    case 'xsty': document.querySelectorAll('[data-a="xsty"]').forEach(b => b.classList.toggle('on', b === el)); $('#sty').value = d.v; ['article','etude','verset','sujet'].forEach(k => { const f = $('#sf_' + k); if (f) f.hidden = k !== d.v; }); break;
    case 'xsuggsend': { const ty = $('#sty').value; const titre = $('#stit').value.trim(); const msg = $('#smsg').value.trim().slice(0, 400); const o = { type:ty, titre, msg };
      if (ty === 'article'){ const u = $('#surl').value.trim(); if (!okJw(u)){ toast(tx('Mets un lien jw.org ou wol.jw.org','Coloque um link do jw.org')); break; } o.url = u; if (!titre) o.titre = u.replace(/^https:\/\/(www\.)?/, '').slice(0, 60); }
      if (ty === 'etude'){ const s = ETUDES.list.find(e => e.id === $('#sid').value); if (!s){ toast(tx('Choisis une étude','Escolha um estudo')); break; } const c = clone(s); c.revele = c.etapes.length; delete c.retenu; o.data = c; if (!titre) o.titre = s.titre; }
      if (ty === 'verset'){ const r = { livre:+$('#sb').value, chapitre:+$('#sc').value, versets:$('#sv').value.trim() || null }; if (!refOk(r)){ toast(tx('Référence invalide','Referência inválida')); break; } o.ref = r; if (!titre) o.titre = refLabel(r); }
      if (ty === 'sujet' && !titre){ toast(tx('Écris l’idée de sujet','Escreva a ideia de tema')); break; }
      await sendSugg(o); break; }
    case 'xsuggsaved': { const x = PERSO.saved.find(s => s.id === d.id); if (!x) break; closeModal();
      suggModal(x.type === 'lien' ? { type:'article', url:x.url, titre:x.titre } : x.type === 'etude' && x.sid ? { type:'etude', sid:x.sid, titre:x.titre } : x.ref ? { type:'verset', ref:x.ref, titre:x.titre } : { type:'sujet', titre:x.titre }); break; }
    case 'xsheart': { const x = SUGG.find(s => s.id === d.id); if (x) suggUpd(x.id, { coeur:!x.coeur }); break; }
    case 'xssave': { const x = SUGG.find(s => s.id === d.id); if (!x) break; const was = isSaved('sugg:' + x.id);
      toggleSave({ key:'sugg:' + x.id, type: x.type === 'article' ? 'lien' : x.type, titre:x.titre, url:x.url, ref:x.ref, data:x.data ? clone(x.data) : undefined, note:x.msg });
      if (!was && x.statut === 'nouveau') suggUpd(x.id, { statut:'a_etudier' }); break; }
    case 'xsdone': suggUpd(d.id, { statut:'fait' }); confetti(); break;
    case 'xsopen': { const x = SUGG.find(s => s.id === d.id); if (x && x.data) savedModal({ id:'s' + x.id, type:'etude', titre:x.titre, data:x.data, key:'sugg:' + x.id }); break; }
    case 'xsoir': { const txt = ($('#soirtxt') || {}).value; if (!txt || !txt.trim()) break; const cid = curCouple(); SOIR[m.id] = txt.trim().slice(0, 600); render();
      try { const ref = DB.doc(`couples/${cid}/soir/${todayISO()}`); const s = await ref.get(); if (s.exists) await ref.update({ [m.id]:SOIR[m.id] }); else await ref.set({ [m.id]:SOIR[m.id] }); } catch(e){ console.warn(e); toast(tx('Envoi impossible pour le moment','Não foi possível enviar')); } break; }
    case 'xcstudy': coupleStudyModal(); break;
    case 'xcgen': { const th = d.v || (($('#cthm') || {}).value || '').trim(); if (!th){ toast(tx('Choisis un thème','Escolha um tema')); break; } makeCoupleStudy(th); break; }
    case 'xcopen': SUBVIEW = 'cet:' + d.id; window.scrollTo(0, 0); render(); break;
    case 'xcback': SUBVIEW = null; render(); break;
    case 'xcetdone': { const ce = CETUDES.find(x => x.id === d.id); if (!ce) break; ce.faite = ce.faite || {}; ce.faite[m.id] = true; confetti(); render(); try { await DB.doc(`couples/${curCouple()}/etudes/${ce.id}`).update({ faite:{ [m.id]:true } }); } catch(e){ console.warn(e); } break; }
    case 'xalt': ALTVIEW[d.id] = !ALTVIEW[d.id]; render(); break;
    case 'xmemo': addVerseModal({ livre:+d.livre, chapitre:+d.chapitre, versets:d.versets || '' }); break;
  }
});

/* Banque de quiz : [id, cat, niveau, livre, chap, versets, question FR, [bonne, faux, faux, faux], preuves FR, question PT, [..], preuves PT]
   Les « preuves » sont des mots qui doivent figurer dans le texte du verset sur wol.jw.org ( ; = et, | = ou ). */
let QB = []; let QB_READY = false; let QB_P = null;
function loadQB(){
  if (QB_P) return QB_P;
  QB_P = new Promise(res => {
    const s = document.createElement('script'); s.src = 'qb.js'; s.async = true;
    s.onload = () => { QB = Array.isArray(window.QB_DATA) ? window.QB_DATA : []; QB_READY = QB.length > 0; res(QB); render(); };
    s.onerror = () => { QB_P = null; res(QB); };
    document.head.appendChild(s);
  });
  return QB_P;
}

let QZ = null, QTAB = 'quiz', QZ_TIMER = null;

const qById = id => QB.find(q => q[0] === id);
function qView(row, rnd){
  const pt = LANG === 'pt'; const ch = (pt ? row[10] : row[7]).slice(); const good = ch[0];
  const order = [0,1,2,3].sort(() => rnd() - .5); const choix = order.map(i => ch[i]);
  return { id:row[0], cat:row[1], lvl:row[2], q:pt ? row[9] : row[6], choix, bonne:choix.indexOf(good), ref:{ livre:row[3], chapitre:row[4], versets:row[5] } };
}
function quizStats(){ PROG.quiz = PROG.quiz || { xp:0, games:0, best:{}, seen:{} }; return PROG.quiz; }
const QRANKS = [[0,'🌱','Débutant','Iniciante'],[500,'📘','Lecteur','Leitor'],[1500,'🔎','Chercheur','Pesquisador'],[3500,'🎓','Étudiant de la Bible','Estudante da Bíblia'],[7000,'🧭','Guide','Guia'],[12000,'💎','Pilier','Coluna'],[20000,'👑','Maître du quiz','Mestre do quiz']];

  const st = quizStats(); const rnd = seeded(Date.now() & 0xffffffff);
  let pool = QB.filter(q => (QZ_PREF.cat === 'tout' || q[1] === QZ_PREF.cat) && (!QZ_PREF.lvl || q[2] === QZ_PREF.lvl));
  if (pool.length < 4) pool = QB.slice();
  let chosen;
  if (ids) chosen = ids.map(qById).filter(Boolean);
  else { const seen = id => (st.seen[id] || [0])[0]; chosen = pool.slice().sort((a, b) => (seen(a[0]) - seen(b[0])) || (rnd() - .5)); if (mode === 'rapide') chosen = chosen.slice(0, 10); }
  QZ = { mode, qs:chosen.map(r => qView(r, rnd)), i:0, rep:[], score:0, combo:0, bestCombo:0, ok:0, tq:Date.now(), t0:Date.now(), ans:null, gain:0, defi:defi || null, fin:false };
  if (mode === 'chrono'){ clearInterval(QZ_TIMER); QZ_TIMER = setInterval(() => {
    if (!QZ || QZ.mode !== 'chrono' || QZ.fin){ clearInterval(QZ_TIMER); return; }
    const left = Math.max(0, 60 - Math.floor((Date.now() - QZ.t0) / 1000)); const el = document.getElementById('qztime'); if (el) el.textContent = left + ' s';
    if (left <= 0) endQuiz(); }, 250); }

function answerQuiz(j){
  if (!QZ || QZ.ans != null || QZ.fin) return; const q = QZ.qs[QZ.i]; QZ.ans = j; const ok = j === q.bonne; const st = quizStats();
  const sec = (Date.now() - QZ.tq) / 1000; st.seen[q.id] = st.seen[q.id] || [0, 0]; st.seen[q.id][0]++; if (ok){ st.seen[q.id][1]++; st.seen[q.id][2] = (st.seen[q.id][2] || 0) + 1; } else st.seen[q.id][2] = 0;   /* [posées, justes, justes depuis la dernière erreur] */
  if (ok){ QZ.ok++; QZ.combo++; QZ.bestCombo = Math.max(QZ.bestCombo, QZ.combo); QZ.gain = 100 + Math.max(0, 50 - Math.floor(sec * 5)) + (QZ.combo >= 3 ? 25 * Math.min(QZ.combo - 2, 4) : 0); QZ.score += QZ.gain; }
  else { QZ.combo = 0; QZ.gain = 0; }
  QZ.rep.push(j);
  if (QZ.mode === 'chrono'){ setTimeout(() => { if (QZ && !QZ.fin){ nextQuiz(); } }, ok ? 450 : 1100); }
  render();
}
function nextQuiz(){
  if (!QZ) return; QZ.i++; QZ.ans = null; QZ.tq = Date.now();
  if (QZ.i >= QZ.qs.length){ if (QZ.mode === 'chrono'){ const rnd = seeded(Date.now() & 0xffffffff); QZ.qs = QZ.qs.concat(QB.slice().sort(() => rnd() - .5).map(r => qView(r, rnd))); } else return endQuiz(); }
  render();
}
function endQuiz(){
  if (!QZ || QZ.fin) return; QZ.fin = true; clearInterval(QZ_TIMER);
  const st = quizStats(); st.games++; st.xp += QZ.score; const old = st.best[QZ.mode] || 0; QZ.record = QZ.score > old; if (QZ.record) st.best[QZ.mode] = QZ.score;
  const ks = Object.keys(st.seen); if (ks.length > 1500) ks.slice(0, ks.length - 1500).forEach(k => delete st.seen[k]);

}

     ${answered ? `<div class="fb">${QZ.ans === q.bonne ? `🎉 +${QZ.gain} pts` : `💡 ${tx('Bonne réponse','Resposta certa')} : <b>${esc(q.choix[q.bonne])}</b>`}

       ${QZ.mode === 'rapide' ? `<div class="row mt" style="justify-content:flex-end"><button class="pb white" data-a="qznext">${QZ.i + 1 < n ? tx('Suivante','Próxima') : tx('Résultat','Resultado')} →</button></div>` : ''}`

function btChapters(books, from){
  const out = []; let on = !from;
  for (const b of books) for (let c = 1; c <= BOOKS[b-1][2]; c++){
    if (!on && from && from.b === b && from.c === c) on = true;
    if (on) out.push([b, c, vcount(b, c)]);
  }
  return out;
}
function splitPortions(chs, n){
  const V = chs.reduce((s, x) => s + x[2], 0); if (!chs.length || n < 1) return [];
  n = Math.max(1, Math.min(n, Math.ceil(V / 8)));
  const avg = V / n; const snap = avg >= 40;
  // positions globales : index de verset cumulé -> (chapitre, verset)
  const cum = []; let acc = 0; for (const x of chs){ cum.push(acc); acc += x[2]; }
  const at = g => { let i = 0; while (i + 1 < chs.length && cum[i+1] <= g) i++; return [i, g - cum[i]]; }; // g dans [0,V)
  let bounds = [];
  for (let k = 1; k < n; k++){
    let g = Math.round(k * V / n);
    { const [i, off] = at(g); const nv = chs[i][2];
      if (snap) g = off * 2 < nv ? cum[i] : cum[i] + nv;
      else if (off && nv - off < 6) g = cum[i] + nv; else if (off && off < 6) g = cum[i]; }
    bounds.push(g);
  }
  bounds = [0, ...bounds, V].filter((g, i, a) => i === 0 || g > a[i-1]);
  const portions = [];
  for (let k = 0; k + 1 < bounds.length; k++){
    let g = bounds[k]; const end = bounds[k+1]; const pieces = [];
    while (g < end){ const [i, off] = at(g); const take = Math.min(chs[i][2] - off, end - g); pieces.push([chs[i][0], chs[i][1], off + 1, off + take]); g += take; }
    portions.push(pieces);
  }
  return portions;
}

function btSetPosition(b, c){

    return false;

  if (p.books && !p.books.includes(b)) return false;

  const i = p.streams && p.streams.length > 1 ? -1 : p.seq.findIndex(por => startsAt(por, stream)); if (i >= 0){ s.idx = i; return true; }

  if (p.streams && p.streams.length > 1){ const cur = btToday(); const other = p.streams.find(st => !st.includes(b)); const e = cur && cur.portion ? cur.portion.find(x => other.includes(x[0])) : null;
    s.from2 = e ? { b:e[0], c:e[1] } : null; } else s.from2 = null;

    if (j >= 0){ s.from = null; s.from2 = null; s.idx = j; BT_CACHE = {}; return true; } }

}

/* ---------- planning intelligent de la semaine ---------- */
const BUDGET_DEF = [30, 30, 30, 30, 30, 30, 45]; // dimanche … samedi (minutes par jour)
function budgetOf(d){ const b = (PROF && PROF.budget) || BUDGET_DEF; return +b[dow(d)] || 0; }
/* place les tâches : la lecture quotidienne et les tâches à jour fixe d'abord, puis les tâches à échéance (réunions) au plus tard possible avant l'échéance là où il reste du temps, puis l'étude perso */
function planWeek(items, mon){
  const days = Array.from({ length:7 }, (_, i) => addDays(mon, i)); const t = todayISO(); const dm = doneMap(mon);
  const load = {}; days.forEach(d => load[d] = 0);
  const free = d => capOf(d) - load[d];
  const J = PROG.jour && PROG.jour.date === t && PROG.jour.dispo === dispoOf(t) && (PROG.jour.rs == null || PROG.jour.rs === JSON.stringify([FAM.reunions, (FAM.speciales || {})[monday(t)] || null])) ? PROG.jour.ids : null;
  /* les jours de réunion, rien d'autre n'est prévu (sauf si c'est le seul jour possible) */
  const MW = meetings(mon); const RJ = new Set([MW.vm, MW.tg].filter(Boolean).map(x => x.date));
  const sansReunion = w => { const f = w.filter(d => !RJ.has(d)); return f.length ? f : w; };
  const fixed = items.filter(i => i.fixe), flex = items.filter(i => !i.fixe);
  fixed.forEach(i => { load[i.date] = (load[i.date] || 0) + i.min; });
  const prio = { prep:0, lecture:1, tg:0, qcm:2, perso:3 };
  flex.sort((a, b) => (a.due < b.due ? -1 : a.due > b.due ? 1 : 0) || (prio[a.kind] - prio[b.kind]) || (a.ord || 0) - (b.ord || 0));
  const placed = {};
  /* étapes de préparation des réunions : dans l'ordre, réparties régulièrement sur les jours disponibles */
  const chains = {}; flex.filter(i => i.chain).forEach(i => (chains[i.chain] = chains[i.chain] || []).push(i));
  for (const ch of Object.values(chains)){
    ch.sort((a, b) => a.step - b.step);
    const isDoneC = i => dm[i.id] === 1 || dm[i.id] === 'skip' || dm[i.id] === 'ecoute';
    const hard = ch[0].hard || ch[0].due, lo0 = ch[0].from || mon, due = hard < mon ? mon : hard;   /* jusqu'au jour de la réunion si elle a lieu le soir */
    /* plan « idéal » depuis le début de la fenêtre : sert aussi pour placer ce qui est déjà fait */
    const all = days.filter(d => d >= lo0 && d <= due); const W = all.length ? all : [due];
    ch.forEach((it, k) => { it._ideal = W[Math.min(W.length - 1, Math.floor(k * W.length / ch.length))]; });
    const todo = ch.filter(i => !isDoneC(i) && !i.tard);
    ch.filter(i => isDoneC(i) || i.tard).forEach(it => { it.date = it.tard ? it._ideal : (J && J.includes(it.id) && t >= mon && t <= days[6] ? t : it._ideal); placed[it.id] = it.date; load[it.date] += it.min; });
    let lo = lo0; if (t >= mon && t <= days[6] && t > lo) lo = t;
    for (const it of todo){ const lt = laterOf(dm[it.id]); if (lt && addDays(lt, 1) > lo) lo = addDays(lt, 1); }
    let win = sansReunion(days.filter(d => d >= lo && d <= due));
    if (J && win.length > 1 && win.includes(t)) win = win.filter(d => d > t);   /* pas les étapes du lendemain aujourd'hui */
    if (!win.length){ const last = t >= mon && t <= days[6] && t <= hard ? t : (hard > days[6] ? days[6] : hard < lo ? (t >= mon && t <= days[6] ? t : hard) : hard); win = [last]; }
    /* ce qui a été prévu ce matin reste aujourd'hui */
    const keep = todo.filter(i => J && J.includes(i.id) && t >= mon && t <= days[6] && laterOf(dm[i.id]) !== t);
    keep.forEach(it => { it.date = t; placed[it.id] = t; load[t] += it.min; });
    let rest = todo.filter(i => !keep.includes(i));
    if (keep.length && win.length > 1) win = win.filter(d => d > t);
    win = sansReunion(win);
    rest.forEach((it, k) => { const d = win[Math.min(win.length - 1, Math.floor(k * win.length / rest.length))]; it.date = d; placed[it.id] = d; load[d] += it.min; if (d > (it.hard || d)) it.manque = true; });
    ch.forEach(it => { delete it._ideal; });
  }
  for (const it of flex){
    if (it.chain) continue;
    if (it.tard){ it.date = it.due < mon ? mon : it.due > days[6] ? days[6] : it.due; placed[it.id] = it.date; continue; }
    let lo = it.from || mon; if (it.after && placed[it.after]) lo = placed[it.after] > lo ? placed[it.after] : lo;
    let hi = it.due < mon ? mon : it.due;
    if (it.beforeOf && placed[it.beforeOf]){ const lim = addDays(placed[it.beforeOf], -1); if (lim >= lo && lim < hi) hi = lim; }
    // une tâche pas encore faite ne se planifie pas dans le passé
    const isDone = dm[it.id] === 1 || dm[it.id] === 'skip' || dm[it.id] === 'ecoute';
    if (isDone && J && J.includes(it.id) && t >= mon && t <= days[6]){ it.date = t; load[t] += it.min; placed[it.id] = t; continue; }
    /* programme du jour stable : ce qui a été choisi ce matin reste aujourd'hui */
    if (!isDone && J && J.includes(it.id) && t >= mon && t <= days[6] && laterOf(dm[it.id]) !== t){ it.date = t; load[t] += it.min; placed[it.id] = t; continue; }
    /* « pas eu le temps » : on reprend au plus tôt demain */
    if (!isDone && laterOf(dm[it.id])){ const nx = addDays(laterOf(dm[it.id]), 1); if (nx > lo) lo = nx; if (it.hard && nx > it.hard){ it.date = laterOf(dm[it.id]); it.manque = true; placed[it.id] = it.date; continue; } }

    if (J && !isDone && win.length > 1) win = win.filter(d => d !== t);
    if (!win.length){ it.date = !isDone && t >= mon && t <= days[6] ? t : hi > days[6] ? days[6] : hi; load[it.date] = (load[it.date] || 0) + it.min; placed[it.id] = it.date; continue; }
    let pick = null;
    if (it.spread){ const same = d => flex.some(o => o !== it && o.kind === it.kind && placed[o.id] === d) ? 1 : 0; pick = win.slice().sort((a, b) => same(a) - same(b) || free(b) - free(a) || (a < b ? 1 : -1))[0]; }
    else { for (let k = win.length - 1; k >= 0; k--) if (free(win[k]) >= it.min){ pick = win[k]; break; } }
    if (!pick) pick = win.slice().sort((a, b) => free(b) - free(a))[0];
    it.date = pick; load[pick] += it.min; placed[it.id] = pick;
  }
  for (const it of items){
    if (it.kind === 'reunion' || it.kind === 'bt' || !RJ.has(it.date)) continue;
    const v = dm[it.id]; if (v === 1 || v === 'skip' || v === 'ecoute') continue;
    const lo1 = it.from || mon; const avant = days.filter(d => d < it.date && d >= t && d >= lo1 && !RJ.has(d)).pop(); const apres = days.find(d => d > it.date && d >= t && d >= lo1 && !RJ.has(d) && (!it.hard || d <= it.hard));
    const nd = avant || apres; if (nd){ load[it.date] -= it.min; it.date = nd; load[nd] = (load[nd] || 0) + it.min; } else it.manque = true;
  }
  /* pas d'accumulation en fin de semaine : au plus une étude perso par jour ; le reste de la semaine écoulée est laissé de côté */
  const isDoneP = i => { const v = dm[i.id]; return v === 1 || v === 'skip' || v === 'ecoute'; };
  for (const d of days){ const ps = items.filter(i => i.kind === 'perso' && i.date === d && !isDoneP(i)); ps.slice(1).forEach(i => { if (d >= t) i.manque = true; }); }
  items.forEach(i => { i.urgent = i.urgent || (i.due && !i.fixe && diffDays(t, i.due) <= 1 && i.date <= t && i.date >= t); });
  return load;
}

/* même interface que la base de claude.ai : doc(path).get/set/update/delete/onSnapshot, collection(c)… */
/* Firestore refuse les tableaux dans des tableaux (ex. l'agenda [[titre, min, fait]], les liens des cultes) :
   on les range dans {__a:[…]} à l'écriture et on les remet en tableaux à la lecture */
const fsEnc = v => Array.isArray(v) ? v.map(x => Array.isArray(x) ? { __a:fsEnc(x) } : fsEnc(x)) : (v && typeof v === 'object') ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, fsEnc(x)])) : v;
const fsDec = v => Array.isArray(v) ? v.map(fsDec) : (v && typeof v === 'object') ? (Object.keys(v).length === 1 && Array.isArray(v.__a) ? fsDec(v.__a) : Object.fromEntries(Object.entries(v).map(([k, x]) => [k, fsDec(x)]))) : v;
function fireDB(pre){
  const { Fs } = FB, db = FB.db;
  const wd = s => ({ exists: s.exists(), id: s.id, data: () => fsDec(s.data()), metadata: s.metadata });
  const ref = p => Fs.doc(db, pre + p);
  const docApi = p => ({
    get: async () => wd(await Fs.getDoc(ref(p))),
    set: o => Fs.setDoc(ref(p), fsEnc(o)), update: o => Fs.updateDoc(ref(p), fsEnc(o)), delete: () => Fs.deleteDoc(ref(p)),
    onSnapshot: (next, err) => Fs.onSnapshot(ref(p), { includeMetadataChanges:true }, s => next(wd(s)), err)
  });
  const coll = c => { const cons = []; const qq = () => Fs.query(Fs.collection(db, pre + c), ...cons);
    const q = { path:c, doc: id => docApi(c + '/' + (id || uidGen())), where: () => q,
      orderBy: (f, dir) => { cons.push(Fs.orderBy(f, dir)); return q; }, limit: n => { cons.push(Fs.limit(n)); return q; },
      get: async () => { const s = await Fs.getDocs(qq()); return { docs:s.docs.map(wd) }; },
      onSnapshot: (next, err) => Fs.onSnapshot(qq(), s => next({ docs:s.docs.map(wd) }), err) };
    return q; };
  return { doc:docApi, collection:coll };
}

  if (!r.ok) throw { code:'oai_' + r.status }; return r.json();
}

}

/* =====================  Programme automatique (jw.org)  =====================
   L'API publique des médias de jw.org donne, pour chaque cahier et chaque Tour de Garde d'étude,
   les semaines et les identifiants des documents : Lampe ouvre ainsi le bon cahier et le bon article
   dans JW Library, sans rien saisir. Cela ne marche que dans Lampe installée (hors claude.ai). */
const AP_K = 'lampe_autoprog_v1';
const AP_MOIS = { fr:['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'], pt:['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'] };
let AP = (() => { try { return JSON.parse(localStorage.getItem(AP_K) || '{}'); } catch(e){ return {}; } })();
function autoProg(mon){ const L = (AP[LANG] || {}).w || {}; return L[mon] || null; }
/* « 4-10 janvier », « 1er -7 mars », « 29 mars – 4 avril », « (… 4-10 janvier) » → lundi ISO */
function apMonday(title, issueY, issueM){
  const lang = LANG === 'pt' ? 'pt' : 'fr'; const t = String(title || '').toLowerCase().replace(/1er/g, '1').replace(/1º/g, '1');
  const re = new RegExp('(\\d{1,2})\\s*(?:de\\s+)?(' + AP_MOIS[lang].join('|') + ')?', 'g');
  let m, day = null, mo = null; const toks = [];
  while ((m = re.exec(t))) toks.push([+m[1], m[2] ? AP_MOIS[lang].indexOf(m[2]) : null]);
  if (!toks.length) return null;
  day = toks[0][0]; mo = toks[0][1] != null ? toks[0][1] : (toks.find(x => x[1] != null) || [])[1];
  if (mo == null || day < 1 || day > 31) return null;
  let y = issueY; { const t0 = new Date(Date.UTC(y, mo, day)); if (t0.getUTCDate() !== day) return null; }   /* date impossible : on refuse */ const d0 = new Date(Date.UTC(y, mo, day)); const iss = new Date(Date.UTC(issueY, issueM - 1, 1));
  if (d0 < iss - 90 * 864e5) y++;
  const iso = `${y}-${String(mo + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
  return monday(iso);
}
async function apFetch(pub, issue){
  const lw = LANG === 'pt' ? 'T' : 'F';
  const r = await fetch(`https://b.jw-cdn.org/apis/pub-media/GETPUBMEDIALINKS?output=json&alllangs=0&langwritten=${lw}&txtCMSLang=${lw}&fileformat=MP3&pub=${pub}&issue=${issue}`);
  if (!r.ok) return [];
  const j = await r.json(); const f = ((j.files || {})[lw] || {}).MP3 || [];
  return f.map(x => ({ title:x.title, docid:(x.markers && x.markers.documentId) || x.docid }));
}
async function refreshAutoProg(force){
  if (window.claude && typeof window.claude.use === 'function') return;   /* claude.ai bloque ces appels */
  const lang = LANG; const now = Date.now(); const C = AP[lang] = AP[lang] || { w:{}, t:0 };
  if (!force && now - C.t < 20 * 3600e3) return;
  const t = todayISO(); const [Y, Mo] = t.split('-').map(Number);
  const months = []; for (let k = -1; k <= 4; k++){ const d = new Date(Date.UTC(Y, Mo - 1 + k, 1)); months.push([d.getUTCFullYear(), d.getUTCMonth() + 1]); }
  const iss = (y, m) => `${y}${String(m).padStart(2, '0')}`;
  const mwb = [...new Set(months.map(([y, m]) => iss(y, m % 2 ? m : m - 1)))];
  const ws = [...new Set(months.flatMap(([y, m]) => [2, 3].map(b => { const d = new Date(Date.UTC(y, m - 1 - b, 1)); return iss(d.getUTCFullYear(), d.getUTCMonth() + 1); })))];
  let n = 0;
  try {
    for (const is of mwb){ for (const x of await apFetch('mwb', is)){ const mon = apMonday(x.title, +is.slice(0, 4), +is.slice(4)); if (!mon || !x.docid) continue; C.w[mon] = Object.assign(C.w[mon] || {}, { d:x.title, vm:String(x.docid), auto:1 }); n++; } }
    for (const is of ws){ for (const x of await apFetch('w', is)){ const m = /\(([^)]*\d[^)]*)\)\s*$/.exec(x.title || ''); if (!m) continue; const mon = apMonday(m[1], +is.slice(0, 4), +is.slice(4)); if (!mon || !x.docid) continue;
      C.w[mon] = Object.assign(C.w[mon] || {}, { tg:x.title.replace(/\s*\([^)]*\)\s*$/, ''), tgd:String(x.docid), auto:1 }); n++; } }
    const old = addDays(t, -21); for (const k of Object.keys(C.w)) if (k < old) delete C.w[k];
    C.t = now; try { localStorage.setItem(AP_K, JSON.stringify(AP)); } catch(e){}
    if (n) renderSoon();
  } catch(e){ console.warn('programme auto', e); }
}
function autoCoverage(){ const L = Object.keys((AP[LANG] || {}).w || {}).filter(k => (AP[LANG].w[k].vm)).sort(); return L.length ? addDays(L[L.length - 1], 6) : null; }
setTimeout(() => refreshAutoProg(false), 1500);

const btTotalDays = () => { const s = btState(); return Object.values(s.days || {}).filter(v => v && v !== 'f').length + (+s.importJours || 0); };
/* ---------- import d'une sauvegarde Personal Bible Trainer (.biblept = JSON compressé gzip) ---------- */
async function readPBT(file){
  const buf = new Uint8Array(await file.arrayBuffer()); let txt;
  if (buf[0] === 0x1f && buf[1] === 0x8b){ const ds = new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))); txt = await ds.text(); }
  else txt = new TextDecoder().decode(buf);
  return JSON.parse(txt);
}
const pbtDate = n => { const d = new Date(Date.UTC(1970, 0, 1) + n * 864e5); return d.toISOString().slice(0, 10); };
/* Tout a été lu depuis Genèse : on reprend sa position actuelle dans le programme officiel, tout ce qui précède compte comme lu */
function importPBT(o, toutAvant){
  const P = o.Progress || {}, SC = o.ScheduleCustom || {}, SD = o.Schedule || {};
  const y = Math.max(1, +SC.Years || 1); const start = +SC.StartPosition || 0; const day = +(SD.currentDay != null ? SD.currentDay : P.currentReadingIndex) || 0;
  const s0 = btState(); const avant = JSON.stringify(Object.assign({}, s0, { pbt: s0.pbt ? Object.assign({}, s0.pbt, { avant: undefined }) : undefined }));
  const s = s0; const oldDays = Object.assign({}, s.days || {}); s.type = 'canon'; s.years = y; s.cpd = null; s.books = []; s.from = null; s.idxj = {}; s.tap = {};
  s.started = P.startedReading ? pbtDate(P.startedReading) : todayISO();
  const pos = (start + day) * y;                     /* index de portion dans le programme complet depuis Genèse */
  if (toutAvant){ s.idx = pos; }
  else { const g = SBR[start] || SBR[0]; s.from = { b:g[0][0], c:g[0][1] }; s.idx = day * y; }
  s.days = oldDays; let n = 0;                       /* on garde les jours déjà lus dans Lampe (import répétable sans doublon) */
  const pbtDates = new Set();
  for (const hh of (P.history || [])){ const d = pbtDate(hh.date); pbtDates.add(d); if (s.days[d] !== 'p' && s.days[d] !== 'h') s.days[d] = hh.index >= 0 ? 'p' : 'a'; n++; }
  if (P.streakStart && P.lastReadDate){ for (let d = pbtDate(P.streakStart); d <= pbtDate(P.lastReadDate); d = addDays(d, 1)){ pbtDates.add(d); if (!s.days[d]){ s.days[d] = 'p'; n++; } } }
  s.importJours = Math.max(0, (+P.totalNumberOfDays || 0) - pbtDates.size);   /* jours PBT sans date connue, en plus de tous les jours datés (PBT + Lampe) */
  const AC = o.Achievements || {};
  s.pbt = { importe:todayISO(), achievements:(AC.achievements || []).length, livres:AC.booksRead || [], declareAvant:!!toutAvant, declare: toutAvant ? { de:'Genèse 1', jusqua:(SBR[pos - 1] ? btChunks(SBR[pos - 1]).map(c => c.label).join(' · ') : ''), le:todayISO() } : null,
    brut:{ achievements:AC.achievements || [], booksRead:AC.booksRead || [], schedule:SD, custom:SC, totalNumberOfDays:P.totalNumberOfDays, streakStart:P.streakStart, lastReadDate:P.lastReadDate, version:o.Version },
    avant: (s0.pbt && s0.pbt.avant) || avant };
  btCheckBadges(); saveBt(); return { pos, portion:btPlan().seq[s.idx] };
}
